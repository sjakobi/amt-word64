name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 0 * * *'

jobs:
  tool-output:
    name: Generate matrix
    runs-on: ubuntu-latest
    outputs:
      ghc_versions: ${{ steps.gen_output.outputs.ghc_versions }}
      latest_ghc: ${{ steps.gen_output.outputs.latest_ghc }}
    steps:
      - uses: haskell/ghcup-setup@v1
      - name: Generate output
        id: gen_output
        run: |
          all="$(ghcup list -r -t ghc -c available)"
          latest=$(echo "${all}" | grep latest | awk '{ print $2 }')
          other_major=$(echo "${all}" | awk '{ print $2 }' | grep -E '^[0-9]+\.[0-9]+' | awk -F '.' '{ print $1 "." $2}' | sort -Vu | tail -${GHC_TEST_NUM:=3})
          other=$(for v in $other_major ; do point_releases=$(echo "$all" | awk '{ print $2 }' | grep --color=never "^$v.") ; echo "${point_releases}" | tail -n1 ; done)
          selected=$(echo -n ${other} | tr " " "\n" | sort -Vu)
          ghc_exclude=( $GHC_EXCLUDE )
          selected_filtered=()
          for ghc in $selected ; do
            printf '%s\0' "${ghc_exclude[@]}" | grep --quiet --color=never -F -x -z -- $ghc || selected_filtered+=( $ghc )
          done
          unset ghc
          selected_json=$(echo -n ${selected_filtered[@]} | jq -c -r -R 'split(" ") | [ .[] | if length > 0 then . else empty end ]')
          echo "ghc_versions=${selected_json}" >> "$GITHUB_OUTPUT"
          echo "latest_ghc=${latest}" >> "$GITHUB_OUTPUT"
        shell: bash
        env:
          GHC_TEST_NUM: ${{ vars.GHC_TEST_NUM }}
          GHC_EXCLUDE: ${{ vars.GHC_EXCLUDE }}

  build:
    runs-on: ubuntu-latest
    needs: [tool-output]
    strategy:
      fail-fast: false
      matrix:
        ghc: ${{ fromJSON(needs.tool-output.outputs.ghc_versions) }}
        cabal: ["latest"]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -y update
          sudo apt-get -y install build-essential curl libffi-dev libffi8 libgmp-dev libgmp10 libncurses-dev pkg-config libtinfo6 libncurses6

      - uses: haskell/ghcup-setup@v1
        with:
          ghc: ${{ matrix.ghc }}
          cabal: ${{ matrix.cabal }}

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-${{ matrix.ghc }}-cabal-${{ hashFiles('**/*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.ghc }}-cabal-

      - name: Install dependencies
        run: cabal build --only-dependencies --enable-tests

      - name: Build
        run: |
          if [ "${{ matrix.ghc }}" == "${{ needs.tool-output.outputs.latest_ghc }}" ]; then
            cabal build --enable-tests --ghc-options="-Werror"
          else
            cabal build --enable-tests
          fi

      - name: Test
        run: cabal test --enable-tests